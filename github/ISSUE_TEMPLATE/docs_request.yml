name: Documentation request
description: Request a documentation improvement in this repo
title: "[Docs]: "
labels: ["documentation"]
body:
  - type: textarea
    id: gap
    attributes:
      label: What is missing or unclear?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed improvement
      description: Outline the content you’d like to see added/changed.
    validations:
      required: true
  - type: input
    id: learn_link
    attributes:
      label: Related Learn page (if any)
      placeholder: "https://learn.microsoft.com/en-us/azure/extended-zones/..."
    validations:
      required: false
